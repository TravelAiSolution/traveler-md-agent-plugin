name: Security

on:
  pull_request:
    # why: draft PRs skip every job (see each job's `if`); ready_for_review starts the run.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  socket-firewall:
    name: socket firewall (install-time malware block)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      # Hard gate: a package that Socket Firewall blocks fails the job.
      - run: sfw pnpm install --frozen-lockfile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: socket-firewall-log
          path: ~/.socket/
          if-no-files-found: warn
          retention-days: 7

  # CycloneDX SBOM of the dependency graph at this commit, kept 90 days as a
  # workflow artifact so an advisory can be matched to what shipped.
  sbom:
    name: sbom (cyclonedx)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-agent-plugin-${{ github.sha }}.cdx.json
          artifact-name: sbom-agent-plugin-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90
