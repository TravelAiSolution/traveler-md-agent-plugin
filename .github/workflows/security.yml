name: Security

on:
  pull_request:
    # why: draft PRs skip every job (see each job's `if`); ready_for_review starts the run.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  socket-firewall:
    name: socket firewall (install-time malware block)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      # continue-on-error while the baseline settles, matching the sibling
      # repos. Promote to a hard gate after a few clean Dependabot-style
      # dependency bumps have run through it.
      - run: sfw pnpm install --frozen-lockfile
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: socket-firewall-log
          path: ~/.socket/
          if-no-files-found: warn
          retention-days: 7
