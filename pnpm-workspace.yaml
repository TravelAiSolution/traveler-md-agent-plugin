# Supply-chain cooldown: refuse a version until it has been on the registry for
# 3 days, so a hijacked release is yanked before we can install it (the npm
# keyv/cacheable maintainer takeover on 2026-08-04 pushed credential-stealing
# preinstall hooks that were live for ~40 minutes). Covers transitive deps too.
# This MUST live here, not in .npmrc — pnpm 11 silently ignores the kebab-case
# `minimum-release-age` there.
# minimumReleaseAgeStrict only changes what `pnpm add` does with a version
# younger than the cooldown: strict makes it an error, non-strict
# silently appends an exclude entry to this file and installs it. CI is not
# affected either way: every `pnpm install --frozen-lockfile` re-verifies each
# lockfile entry against the cooldown. Strict keeps a young version from
# entering the lockfile without anyone noticing.
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

# simple-git-hooks needs its postinstall to write .git/hooks/*; without this it
# is silently skipped and the repo has no pre-commit gate at all.
allowBuilds:
  simple-git-hooks: true
